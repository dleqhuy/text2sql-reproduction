[project]
name = "text2sql-clone-first"
version = "0.1.0"
description = "Spider reproduction orchestration and evaluation helpers"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["*.py", "*.pyi", "pyproject.toml"]
exclude = [".venv", "third_party", "data", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
